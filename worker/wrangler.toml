name = "awsnap-cookie"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false          # custom routes on awsnap.dev only

# Serve the counter + the live cookie image straight from the edge on awsnap.dev
routes = [
  { pattern = "awsnap.dev/globe/treat", zone_name = "awsnap.dev" },        # give Blip a cookie
  { pattern = "awsnap.dev/globe/pet", zone_name = "awsnap.dev" },          # pet Blip (v4)
  { pattern = "awsnap.dev/globe/play", zone_name = "awsnap.dev" },         # play with Blip (v4)
  { pattern = "awsnap.dev/globe/blip.svg", zone_name = "awsnap.dev" },     # the Blip panel
  { pattern = "awsnap.dev/globe/btn-cookie.svg", zone_name = "awsnap.dev" },  # the three buttons under it (v4)
  { pattern = "awsnap.dev/globe/btn-pet.svg", zone_name = "awsnap.dev" },
  { pattern = "awsnap.dev/globe/btn-play.svg", zone_name = "awsnap.dev" },
  { pattern = "awsnap.dev/globe/count", zone_name = "awsnap.dev" },        # {n,pets,plays,last} JSON
  { pattern = "awsnap.dev/globe/click", zone_name = "awsnap.dev" },        # v2 README (kept)
  { pattern = "awsnap.dev/globe/cookie.svg", zone_name = "awsnap.dev" },   # v2 README (kept)
]

# Durable Object = one strongly-consistent counter instance (KV would be eventually
# consistent, and camo reads from GitHub's edge != the clicker's edge, so KV would lag).
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
